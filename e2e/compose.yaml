name: chessbox-e2e
services:
  mongo:
    image: mongo:6-jammy
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - e2e-mongo:/data/db
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    # No SMTP relay: even chief-judge notifications remain in this mailbox.
volumes:
  e2e-mongo:
